name: Using AI tools with Wikipedia (Professional)
id: 87
description: |
  In this module, you’ll learn why Wikipedia explicitly bans text generated by AI tools.
  You’ll also explore a few specific ways AI tools can assist you when used thoughtfully,
  critically, and in line with the policies of Wikipedia and your course.

