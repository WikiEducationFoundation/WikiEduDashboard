id: 7103
title: "A word of warning: Do NOT use AI to write text for Wikipedia"
content: |
  Wikipedia’s policy is clear — do NOT use AI to write text for Wikipedia.

  This means you shouldn’t ask an AI chatbot to write your Wikipedia article
  for you or use AI output during your Wikipedia assignment exercises. Never
  paste output from an AI tool into a Wikipedia article or on sandbox pages
  during your earlier exercises. (Not even summaries!)

  Wikipedia editors will delete any content you add to Wikipedia that they suspect
  was written by AI. If you paste AI content into Wikipedia, you are wasting the
  time of Wikipedia volunteers. This includes content written with the help of
  editing tools like Grammarly. Repeated violations of this rule can lead to
  you being blocked from editing.

  Why is this so critical? Generative AI tools can fabricate “facts” and
  hallucinate “sources” — and adding untrustworthy content to Wikipedia
  will make it worse for everyone, not better!
