  Heads up! Throughout your Wikipedia assignment, we’re using an **AI detection
  tool called Pangram** to check your work on Wikipedia for generative AI output,
  including all exercises you do for the project.

  Using AI detection isn’t about policing your Wikipedia edits. It’s about
  protecting the accuracy of the encyclopedia we all rely on, and helping you
  course correct if needed.

  Remember, the stakes here are much higher than when you write a traditional
  paper for your professor. Your words on Wikipedia could be read by millions
  and influence real-world decisions!

  If our system detects text that’s likely to be AI-generated,
  you and your instructor will receive a “Fact Verification” email.

  If you receive this AI detection alert, please be sure to follow the instructions provided.
  We’ll talk more about the “Fact Verification” email in a bit.
