id: 1215
title: Checking the facts
summary:
content: |
  Statements in Wikipedia articles don’t just need supporting citations, the
  facts need to be supported by the cited sources. Can you access the cited
  source? (If not, you might want to ask your classmate for help finding it.)

  * If you can access it, is the citation specific enough that you can track
  down the supporting statement with a reasonable amount of effort? (If it’s a
  chapter in a book, are there page numbers?)
  * Can you verify the statements in the article by checking the source that’s
  being cited to support each statement?
  * Does the source support the statement?
