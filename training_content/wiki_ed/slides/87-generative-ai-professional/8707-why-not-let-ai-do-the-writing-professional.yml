id: 8707
title: Why not let AI do the writing?
summary: ''
content: |
  Your ability to evaluate sources, review them carefully, and synthesize
  the information they provide is essential to improving the encyclopedia.

  Generative AI tools do a poor job writing about things missing from Wikipedia,
  because their own knowledge is largely based on what’s already on Wikipedia.
  Sometimes an AI tool may suggest adding content to Wikipedia even when
  there are no sources to support that information.

  Remember, anyone who reads the text you add to Wikipedia will assume
  you verified the information and cited reliable sources.
