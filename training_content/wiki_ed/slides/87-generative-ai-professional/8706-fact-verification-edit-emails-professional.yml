title: How to respond to "Fact Verification" emails
summary: ''
content: |
  Remember, when a text is flagged by the AI detector, it serves as a signal
  to double check that the added information is accurate, can be found in
  the cited source, and fully adheres to Wikipedia’s verifiability policy.

  If you get an email about “Fact Verification,” this means the text you
  added to Wikipedia was flagged, and you need to remove and then revisit it!

  The email alert will contain a list of steps for you and your instructor
  to follow.

  First, you’ll **remove the flagged text from the Wikipedia article as soon
  as possible.**

  Whether or not you used AI to write the text, take this opportunity to
  be sure your edits are in your own words, double check citations to
  confirm they are accurate, and check in with your course instructor.
