        about: |-
          آرٹیکل سکوپڈ پروگرام کیتے، Dashboard صرف انہاں مضموناں تے کیتیاں ڳئیاں ترامیم دی کھوج کریسی جیہڑے تہاݙے ترتیب ݙتے ہووݨ۔ تہاݙا صفحہ بنڑݨ دے بعد، تساں کھوج کیتے انفرادی مضموناں کوں انفرادی ایڈیٹرز کوں تفویض کرکے یا انہاں کوں دستیاب مضموناں دے طور تے شامل کرکے شامل کر سڳدے ہو، یا مضموناں دے وݙے سیٹاں کیتے، تساں انہاں وچوں کوئی وی ٹول استعمال کر سڳدے ہو تاں جو انہاں مضموناں دی وضاحت کر سڳو جیہڑے تساں کھوج کرݨا چاہندے ہو۔

          جیہڑے دائرہ کار دے طریقے تساں ہݨ ترتیب ݙیوݨا چاہندے ہو، چݨو۔ تساں مضموناں ٹیب توں بعد وچ وی دائرہ کار دے طریقے شامل کر سڳدے ہو۔
        categories: ونکیاں
        categories_short_desc: وکی تے زمرہ دی خصوصیت متعلقہ مضموناں کوں اکٹھا کرݨ
          کیتے استعمال تھیندی اے۔ تساں زمرہ دا ناں استعمال کر سڳدے ہو تاں جو Dashboard
          کوں ݙسو جو اوہ زمرے دے سارے مضموناں دی کھوج کرے۔
        categories_desc: زمرے دی کھوج کرݨ دا مطلب اے اے جو Dashboard اوہ زمرے دے کونجھے
          وی مضموناں تے کیتیاں ڳئیاں ترامیم کوں ڳݨسی۔ ڈیفالٹ طور تے (گہرائی 0)، صرف
          اوہ مضامین کھوج کیتے ویسن جیہڑے براہ راست اوہ زمرے وچ ہن۔ تساں گہرائی دی
          قدر ودھا سڳدے ہو (زیادہ توں زیادہ 3 تئیں) جے تساں انہاں مضموناں کوں شامل
          کرݨا چاہندے ہو جیہڑے اوہ زمرے دے ذیلی زمریاں وچ ہن۔ پہلے زمرہ کوں ضرور براؤز
          کرو، تاں جو یقینی بݨاؤ جو ذیلی زمرے انہاں نال میل کھاندن جیہڑے تساں کھوج
          کرݨا چاہندے ہو۔
