      step_verify: دعوے دی تصدیق کرو
      verify_instructions: |-
        ہݨ جڈاں تساں حوالہ شدہ ماخذ لبھ گھدا اے، ایہ طے کرو کہ ایہ تساں دے چݨے ہوئے دعوے دی کیتی حمایت کریندے۔ جے تساں کوں ٹھیک ٹھیک پتا لڳ ونجے کہ معلومات کتھوں آئیاں ہن، تاں دستاویز وچ او جاہ لکھو جتھے تساں اونہیں کوں پایا۔

        تصدیق کیتے نکات:
        - ماخذ دا خلاصہ تے نتیجہ پڑھو۔ کیا ایہ دعوے دے موضوع دا احاطہ کریندے؟
        - اپݨی ایپلیکیشن وچ "find" فنکشن ورتو۔ ماخذ وچ دعوے دے اہم لفظ لبھو، وت اوں دے آݙو ٻاݙو دا متن پڑھو جتھے او نظر آن۔ جے تساں متن وچ اہم لفظ یا اونھاں دے مترادف نئیں لبھ سڳدے، تاں دعویٰ شاید غیر قابل تصدیق اے۔
        - جنریٹیو اے آئی ماخذاں توں بنڑیا ہویا متن اکثر کسے موضوع بارے وسیع، عام دعوے کریندے، تے اینجھا حوالہ ݙیندے جیہڑا اوں دعوے دی صرف ہک چھوٹی مثال ݙیوݨ آلے ماخذ دا حوالہ ہوندے۔ کیا دعویٰ کہیں خاص مثال توں عام دعویٰ اخذ کریندا پئے؟ جے ہاں، تاں ایہ غیر قابل تصدیق اے۔
