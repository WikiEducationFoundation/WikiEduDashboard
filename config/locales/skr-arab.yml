    editing: ترمیم دے تجویزات
    suggestion_docs:
      fa: جے تائیں نئی معلومات دستیاب نہ تھیوے، ٻیا مواد شامل کرݨ دی ضرورت نئیں ہوندی؛
        عبارت دے معیار وچ ٻیا بہتری اکثر ممکن ہوندی اے۔
      a: مضمون کوں بہتر کرݨ کیتے ماہر علم دی ضرورت ہو سڳدی اے، تے انداز دے مسئلے حل
        کرݨ دی ضرورت ہو سڳدی اے۔ ساتھی جائزہ مدد کر سڳدا اے۔
      ga: موضوع تے انداز دے ماہرین دی کجھ ترمیم مددگار اے؛ ملدے جلدے موضوع دے ہک موجودہ
        نمایاں مضمون نال موازنہ انہاں حصیاں کوں نمایاں کر سڳدا اے جتھے مواد کمزور
        یا گھٹ اے۔
      bplus: ماہرین دے مشورے نال بہتر کیتا ونج سڳدا اے تاں جو اندازہ تھیوے جو کتھے
        کوریج اڄ وی گھٹ اے، تے تصویراں، تاریخی پس منظر تے ٻئے حوالے نال وی۔ ساتھی
        جائزہ تے غور کرو یا چنگے مضمون دے درجے کیتے نامزد کرو۔ جے مضمون اڄ تک مکمل
        وکیفائی نئیں تھیا، تاں ہݨ وقت اے۔
      b: مواد تے انداز دے کجھ پہلو حل کرݨ دی ضرورت اے۔ ماہر علم دی ضرورت ہو سڳدی اے۔
        جے ممکن ہووے تاں معاون مواد شامل کرݨ تے غور کیتا ونجے، تے مضمون کوں انداز
        دی ہدایت تے متعلقہ اندازی ہدایتاں دی عمومی پابندی کیتے جانچیا ونجے۔
      c: مواد وچ خلا بند کرݨ تے صفائی دے مسئلے حل کرݨ کیتے کافی ترمیم دی ضرورت اے۔
      start: قابل اعتماد ذرائع دے حوالے ݙیوݨ سب توں پہلاں آوݨ چاہیدے؛ مضمون کوں مواد
        تے ترتیب وچ وی نمایاں بہتری دی ضرورت اے۔ گرامر، ہجے، تحریری انداز وی بہتر
        کرو تے اصطلاحات دا استعمال وی بہتر کرو۔
      stub: کوئی وی ترمیم یا اضافی مواد مددگار ہو سڳدا اے۔ بامعنی مواد فراہم کرݨ کوں
        ترجیح ہووݨی چاہیدی اے۔ اسٹب درجے دے مضمون دے اسٹارٹ درجے تک پڄݨ دا بہترین
        حل اے جو موضوع دی اہمیت دیاں حوالہ شدہ وجوہات شامل کیتیاں ونجن۔
      fl: جے تائیں نئی معلومات دستیاب نہ تھیوے، ٻیا مواد شامل کرݨ دی ضرورت نئیں ہوندی۔
      list: فہرستاں وچ ویکیپیڈیا دے مضامین دے جیندے لنکاں دیاں فہرستاں ہووݨیاں چاہیدیاں
        ہن، جیہڑیاں مناسب ناں تے ترتیب نال ہوون۔
      future: شامل کیتا ڳیا مواد قیاس آرائی ہو سڳدا اے تے اونہوں کوں احتیاط نال حوالہ
        ݙتا ونجے۔
      disambig: اوس ناں دے نویں مضامین بنڑاوݨ نال اضافے کرݨے چاہیدے ہن۔ ایہوجے صفحات
        دے مناسب ناں ݙیوݨ تے خاص توجہ ݙیو، کیوں جو اکثر انہاں دے عنوان نال "(disambiguation)"
        لاوݨ دی ضرورت نئیں ہوندی۔
