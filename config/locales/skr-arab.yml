          اینھ دا ہک اہم حصہ نئیں اے۔
        unsupported: نئیں — ماخذ اوں ڳالھ دا احاطہ نئیں کریندا جیہڑا دعویٰ آکھدا اے۔
        contradicted: الٹا — ماخذ اصل وچ دعوے دی تردید کریندا اے۔
        undetermined: میں ایہ طے نئیں کر سڳیا کہ دعویٰ حوالہ شدہ ماخذ وچ موجود ہا
          یا نئیں۔
        mostly_supports: بہت حد تائیں ہا — دعوے دی مرکزی ڳالھ ایں ماخذ توں آئی اے۔
        mostly_unsupported: بہت حد تائیں نئیں — ماخذ دعوے دے مطابق اے، لیکن براہِ
          راست اینھ دی تائید نئیں کریندا۔
      verdict_option_descriptions:
        full_support: میں دعوے دیاں ساریاں ڳالھیں حوالہ شدہ ماخذ وچ لبھ سڳدا ہاں۔
        partial_support: میں دعوے دیاں کجھ ڳالھیں لبھ سڳدا ہاں، لیکن دعوے وچ اینھی
          معلومات وی اے جیہڑی میں حوالہ شدہ ماخذ وچ نئیں لبھ سڳیا۔
        unsupported: میں دعوے دیاں کوئی وی ڳالھیں حوالہ شدہ ماخذ وچ نئیں لبھ سڳیا۔
        contradicted: میں حوالہ شدہ ماخذ وچ اینھیں ڳالھیں لبھیاں ہن جیہڑیاں دعوے وچ
          آکھی ڳئی ڳالھ دی الٹ ہن۔
