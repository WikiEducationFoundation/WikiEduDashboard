          ہو جیہڑا انہاں وچ موجود ہووے، جیہڑا اینجھے وی کم کریندا اے چاہے Template
          مضمون تے ہی استعمال تھئے یا متعلقہ ڳالھ صفحے تے — جیویں WikiProject templates۔
        petscan: PetScan
        petscan_short_desc: PetScan ہک ٹول اے جیہڑا تہاکوں وسیع رینج دے معیاراں —
          جنہاں وچ زمرے، Template، وکی لنکس، تے ٻہوں کجھ ہور وی شامل اے — دی بنیاد
          تے وکی صفحات کوں query کرݨ دی اجازت ݙیندا اے۔ تساں Dashboard تے کھوج کرݨ
          کیتے مضموناں دا ہک سیٹ ترتیب ݙیوݨ کیتے PetScan query ID استعمال کر سڳدے
          ہو۔
        pagepile: PagePile
        pagepile_short_desc: PagePile ہک ٹول اے جیہڑا تہاکوں صفحات دی ہک فہرست بنڑاوݨ
          دی اجازت ݙیندا اے جیہڑی وقت دے نال ناہیں تبدیل تھیندی تے ہک منفرد ID نال
          پہچاݨی ویندی اے۔
        templates_desc: Template وکی صفحات تے مقصدآں دی وسیع رینج کیتے استعمال تھیندن،
          لیکن کجھ ہک موضوع کیتے خاص ہوندن۔ نیویگیشن Template، WikiProject Template،
          تے موضوع-خاص Infobox Template خاص طور تے مفید ہوندن جڈاں ہک Template استعمال
          کرکے ہک آرٹیکل سکوپڈ پروگرام ترتیب ݙتا ویندا اے۔
        pagepile_desc: |-
          PagePile Wikimedia Cloud تے ہک ٹول اے۔ ایہ یوزراں کوں وکی صفحات دے ہک گروپ کوں "pile" ناں دے ہک سنگل بنڈل وچ اکٹھا کرݨ تے منظم کرݨ دی اجازت ݙیندا اے۔ اینہوں piles کوں وت ٻیاں نال آسانی نال شیئر کیتا ونڄ سڳدا اے، جیہڑا باہمی کم تے معلومات دے اشتراک کوں قابل بݨیندا اے۔

          PetScan دے برعکس، ہک pile وچ مضامین وقت دے نال ناہیں تبدیل تھیسن، چاہے زمرے، Template یا ٻیا ڈیٹا جیہڑا مضموناں دے اوہ سیٹ بنڑاوݨ کیتے استعمال تھئے ہن، تبدیل تھی ڳئے ہووݨ۔
        petscan_desc: |-
          PetScan وکی صفحات دے ہک سیٹ کوں معیاراں تے ڈیٹا سورسز دی وسیع رینج دی بنیاد تے query کرݨ کیتے ہک طاقتور لیکن پیچیدہ ٹول اے۔ تساں مضموناں دے اوہ سیٹ کیتے query بنڑاوݨ کیتے PetScan کوں براہِ راست استعمال کر سڳدے ہو جنہاں دی تساں کھوج کرݨ چاہندے ہو، جیہڑا تہاکوں تہاݙے query کوں ٻہوں درست طریقے نال ٹارگٹ کرݨ کیتے مکمل آپشنز تئیں رسائی ݙیندا اے۔ متبادل طور تے، تساں سب توں عام آپشنز وچوں کجھ توں PetScan query براہِ راست Dashboard توں بنڑا سڳدے ہو۔

          PetScan query parameters کوں محفوظ کریندا اے تے اوہ query کیتے ہک ID ݙیندا اے۔ اوہ query دے نتائج وقت دے نال تبدیل تھی سڳدن، مثال دے طور تے جڈاں اوہ زمرہ وچ نویں مضامین شامل کیتے ونڄن جیہڑا query وچ شامل اے۔ Dashboard ݙتے ڳئے ID کیتے query دے نتائج کوں وقفے وقفے نال refresh کریسی، تے اینہ دے اعدادوشمار کوں مضموناں دے تازہ ترین سیٹ دی بنیاد تے اپڈیٹ کریسی جیہڑا PetScan پیدا کریندا اے۔
