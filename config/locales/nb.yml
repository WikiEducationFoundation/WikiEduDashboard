    course_picker_heading: Velg kurs
    course_picker_no_courses: Ingen kurs
    take_not_enrolled: Du må være påmeldt kurset for å gjøre det.
    intro_p1: Hver påstand på Wikipedia bør støttes av en pålitelig kilde. Når man
      leser Wikipedia for informasjon, bør en ikke måtte ta forfatterens ord for det;
      du kan finne den siterte kilden og lese den informasjonen selv. Dette er det
      som er kjent som verifiserbart, og er en av de mest viktigste retningslinjene
      bak Wikipedias troverdighet.
    intro_p2: Etterhvert som KI-verktøy blir mer utbredt, er det viktigere enn noen
      kan å vite hvordan man verifiserer informasjon. KI-generert innhold blandet
      ofte fakta og kilder – som er en av de største grunnene hvorfor en ikke kan
      bruke det for å legge innhold til Wikipedia.
    intro_p3: I denne øvelsen ser du verifiserbarhet i praksis. Du kan øve deg på
      å verifisere påstander ved å prøve å finne et spesifikt faktum i en sitert kilde.
    step_select_article: 'Trinn 1: Velg en artikkel.'
    select_claim_instructions: 'De følgende påstandene må sjekkes mot de siterte kildene,
      fordi det kan hende de er KI-genererte. (Merk: artikkelen kan ha blitt endret
      siden disse påstandene ble lagt til.)'
    form:
      step_find_source: 'Trinn 2: Finn kilden'
      find_source_instructions: Nå som du har valgt din påstand, bør du finne den
        siterte kilden. Det må kanskje rådføre deg med instruktøren eller bibliotekaren
        din for å finne kilden.
      source_access_question: Klarte du å finne hele teksten til den siterte kilden
        for påstanden din?
      source_access_options:
        accessed: Ja, jeg fikk kilden.
        nonexistent: Nei, kilden eksisterer ikke.
        inaccessible: Nei, kilden eksisterer, men jeg fikk ikke tilgang.
      source_access_notes_label: 'Dersom du ikke kunne finne kilden, fortell oss mer
        om din erfaring:'
      step_verify: 'Trinn 4: Verifiser påstanden'
      verify_instructions: Når du har funnet den siterte kilden, bør du undersøke
        den nøye for å finne ut hvor godt den støtter påstanden du har valgt. Hvis
        du finner nøyaktig hvor informasjonen kommer fra, bør du notere hvor i dokumentet
        du fant den. (Noen sitater er for upresise til at en leser kan bekrefte dem
        i praksis.)
      verdict_question: Støtter kilden påstanden?
      verdict_options:
        full_support: Ja – den støtter tydelig hele påstanden.
        partial_support: Delvis – noen elementer av påstanden kommer fra denne kilden,
          men en betydelig del gjør ikke det.
        unsupported: Nei – kilden dekker ikke hva påstanden sier.
        contradicted: Det motsatte – kilden motsier faktisk påstanden.
        undetermined: Jeg klarte ikke å avgjøre om påstanden sto i den siterte kilden.
        mostly_supports: Stort sett ja – kjernen i påstanden kommer fra denne kilden.
        mostly_unsupported: Stort sett nei – kilden er kompatibel med påstanden, men
          støtter den ikke direkte.
      claim_location_label: Hvis du klarte å finne påstanden, hvor i kilden sto den?
        (f.eks. sidetall, kapittel osv.)
      verification_notes_label: Hvis du ikke klarte å bekrefte informasjonen, fortell
        oss mer om din erfaring. (f.eks. var kilden uklar eller vanskelig å lese?
        Var kilden ikke relatert til påstanden? Var sitatet upresist og kilden for
        lang til å kunne konsulteres på en rimelig måte?)
      other_comments_label: Noen andre kommentarer til denne øvelsen?
