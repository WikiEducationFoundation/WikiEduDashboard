      scoping_methods:
        scoping_methods: Omfangsmetoder
        configure: Konfigurer omfangsmetoder
        about: |-
          For et fokusert artikkelprogram kommer kontrollpanelet bare til spore redigeringer i artiklene du har konfigurert det for. Etter at siden din er opprettet, kan du legge til individuelle artikler for å spore tildeling av artikler til individuelle bidragsytere eller ved å legge dem til som tilgjengelige artikler. For større sett med artikler kan du bruke et av disse verktøyene til å definere artikler du vil spore.
          Velg eventuelle omfangsmetoder du vil konfigurere nå. Du kan også legge til omfangsmetoder senere fra artikkelfanen.
        categories: Kategorier
        categories_short_desc: Kategorifunksjonen på en wiki brukes til å samle relaterte
          artikler. Du kan bruke navnet på kategorien til å be dashbordet spore alle
          artiklene i den kategorien.
        categories_desc: Kategorisporing betyr at kontrollpanelet teller redigeringer
          gjort til enhver artikkel i den kategorien. Som standard (dybde 0)), telles
          kun artikler som er direkte i den kategorien. Du kan endre dybdenivået (maks
          3) dersom du ønsker å inkludere artikler som er i underkategorier også.
          Sørg for å kikke gjennom kategorien først, slik at du er sikker på at underkategoriene
          samsvarer med det du ønsker å spore.
        templates: Maler
        templates_short_desc: Du kan spore artikler basert på en mal de har, som fungerer
          både hvis malen er brukt på selve artikkelen eller på den tilhørende diskusjonssiden
          – som underprosjektsmaler.
        petscan: PetScan
        petscan_short_desc: PetScan er et verktøy som lar det utføre wikisidespørringer
          basert på mange kriterier – inkludert kategorier, maler, wikilenker og mer.
          Du kan bruke en PetScan-spørrings-ID for å konfigurere et sett med artikler
          som skal spores med kontrollpanelet.
        pagepile: PagePile
        pagepile_short_desc: PagePile er et verktøy som lar det skape en liste over
          sider som ikke endres over tid og er identifisert med en unik ID.
        templates_desc: Maler er brukt for mange ting på wikisider, men noen er spesifikke
          til et emne. Navigasjonsmaler, underprosjektsmaler og emnespesifikke infoboks-maler
          er spesielt nyttige når en bruker en mal for å konfigurere et fokusert artikkelprogram.
        pagepile_desc: |-
          PagePile er et verktøy på Wikimedia Cloud. Det lar brukere samle og organisere en gruppe wikisider i én enkelt bunt kalt en «Pile», altså en haug. Disse haugene kan deretter enkelt deles med andre, noe som muliggjør samarbeid og informasjonsdeling.
          I motsetning til PetScan vil ikke artiklene i en haug endres over tid, selv når kategorier, maler eller andre data som brukes til å opprette det settet med artikler har endret seg.
        petscan_desc: |-
          PetScan er et kraftig, men komplekst verktøy for å søke etter et sett med wikisider basert på et bredt utvalg av kriterier og datakilder. Du kan bruke PetScan direkte til å opprette spørringen for et sett med artikler du vil spore, noe som gir deg tilgang til hele settet med alternativer for å målrette spørringen din svært presist. Alternativt kan du opprette en PetScan-spørring fra noen av de vanligste alternativene direkte fra kontrollpanelet.
          PetScan lagrer spørreparametrene og gir en ID for den spørringen. Resultatene av den spørringen kan endres over tid, for eksempel når nye artikler legges til kategorien som spørringen inkluderer. Kontrollpanelet vil med jevne mellomrom oppdatere spørreresultatene for en gitt ID, og vil oppdatere statistikken basert på det nyeste settet med artikler som PetScan produserer.
        petscan_create_psid: Opprett en PetScan-ID med det offisielle PetScan-verktøyet
        pagepile_create_id: Lag en PagePile med det offisielle PagePile-verktøyet
        categories_include_OR: Artikler som inneholder MINST ÉN av disse kategoriene
          vil bli sporet
        templates_include_OR: Artikler som inneholder MINST ÉN av disse malene vil
          bli sporet
        start_typing_to_search: Begynn å skrive for å søke
