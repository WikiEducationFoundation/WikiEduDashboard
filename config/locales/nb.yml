  suggestions:
    editing: Redigeringsforslag
    suggestion_docs:
      fa: Det bør ikke være nødvendig med ytterligere tillegg av innhold med mindre
        ny informasjon blir tilgjengelig; ytterligere forbedringer av prosakvaliteten
        er ofte mulig.
      a: Ekspertkunnskap kan være nødvendig for å finjustere artikkelen, og stilproblemer
        må kanskje løses. Gjennomgang kan hjelpe.
      ga: Noe redigering av emne- og stileksperter er nyttig; sammenligning med en
        eksisterende utvalgt artikkel med et lignende emne kan fremheve områder der
        innhold er svakt eller manglende.
      bplus: Kan forbedres med innspill fra eksperter for å vurdere hvor det fortsatt
        mangler dekning, og også med illustrasjoner, historisk bakgrunn og ytterligere
        referanser. Vurder gjennomgang eller nominasjon for god artikkelstatus. Hvis
        artikkelen ikke allerede er fullstendig wikifisert, er nå det rette tidspunktet.
      b: Noen få aspekter ved innhold og stil må tas opp. Ekspertkunnskap kan være
        nødvendig. Inkludering av støttemateriell bør vurderes hvis det er praktisk,
        og artikkelen kontrolleres for generelt samsvar med stilmanualen og relaterte
        stilretningslinjer.
      c: Det er behov for betydelig redigering for å tette hull i innholdet og løse
        oppryddingproblemer.
      start: Referanser til pålitelige kilder bør komme først; artikkelen trenger
        også betydelig forbedring av innhold og organisering. Forbedre også grammatikk,
        staving, skrivestil og bruk av sjargong.
      stub: All redigering eller tilleggsmateriale kan være nyttig. Tillegg av meningsfullt
        innhold bør prioriteres. Den beste løsningen for at en artikkel i spireklassen
        skal kunne oppgraderes til en artikkel i startklassen, er å legge til refererte
        begrunnelser for hvorfor emnet er viktig.
      fl: Det skal ikke være nødvendig med ytterligere innholdstillegg med mindre
        ny informasjon blir tilgjengelig.
      list: Listene bør være lister over aktive lenker til Wikipedia-artikler, med
        passende navn og organisering.
      future: Materiale som legges til kan være spekulasjon og bør ha gode kilder.
      disambig: Tillegg bør gjøres etter hvert som nye artikler med det navnet opprettes.
        Vær nøye med riktig navngiving av slike sider, da de ofte ikke trenger «(andre
        betydninger)» lagt til tittelen.
      '?': Forslag ikke tilgjengelig – Artikkelen er enten ikke vurdert, eller forslag
        er ikke tilgjengelige for vurderingen.
      does_not_exist: Denne artikkelen finnes ikke på Wikipedia.
