    wp10: Integridade Estrutural
    wp10_doc: A pontuação de “Integridade Estrutural” representa o grau de adequação
      de um artigo ao modelo de um artigo maduro da Wikipédia, com base no antigo
      (~2015) “Serviço de Avaliação Objetiva de Revisões”, que utilizava aprendizado
      de máquina. Essas pontuações são calculadas com base no tamanho do artigo, no
      número de referências e links da Wikipédia, além de outras características básicas
      do texto. Uma pontuação alta geralmente indica que um artigo segue as convenções
      da Wikipédia para a estrutura de um bom artigo, mas não leva em consideração
      o conteúdo em si.
