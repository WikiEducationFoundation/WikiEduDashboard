      find: Encontrar um programa
      intro: O título do programa e a instituição formam o URL do programa. A wiki
        inicial é a principal wiki onde os participantes estão trabalhando, e as edições
        nesta serão registradas por omissão. Se o seu programa abrange várias línguas
        ou projetos, as contribuições serão registradas em qualquer wiki foi explicitamente
        adicionado a "Wikis rastreadas".. Clique em "Criar o meu Programa!" para começar
        a construir a página do seu programa na wiki.
      new_or_clone: Crie um novo programa agora, ou utilize a opção 'clonar' para
