    take_not_enrolled: Você precisa estar matriculado no curso para fazer isso.
    exercise_heading: Exercício de verificação de fatos
    intro_p1: Todo fato na Wikipédia deve ser comprovado por uma fonte confiável.
      Ao consultar a Wikipédia em busca de informações, você não deve simplesmente
      acreditar na palavra do editor; você pode localizar a fonte citada e ler essas
      informações por conta própria. Isso é o que se chama de verificabilidade, uma
      das políticas mais importantes por trás da credibilidade da Wikipédia.
    intro_p2: À medida que as ferramentas de IA se tornam mais amplamente utilizadas,
      é mais importante do que nunca aprender a verificar informações. O conteúdo
      gerado por IA frequentemente apresenta discrepâncias entre fatos e fontes —
      o que é uma das principais razões pelas quais não é possível usá-lo para adicionar
      conteúdo à Wikipédia.
    intro_p3: Neste exercício, você verá a verificabilidade em ação. Você praticará
      como verificar afirmações tentando encontrar um fato específico em uma fonte
      citada.
    step_heading: 'Etapa %{number}: %{name}'
    step_select_article: Selecione um artigo
    step_select_claim: Escolha a reclamação a ser verificada
    select_article_instructions: Escolha um dos artigos da lista abaixo para começar
      este exercício.
    select_claim_instructions: 'As seguintes afirmações precisam ser verificadas com
      base nas fontes citadas, pois podem ter sido geradas por IA. (Observação: o
      artigo pode ter sofrido alterações desde que essas afirmações foram adicionadas.)'
    form:
      step_evaluate_source: Avaliar a fonte
      evaluate_source_instructions: 'Primeiro, analise a própria fonte: se ela parece
        confiável e se é adequada ao tema. Talvez seja interessante revisar o [treinamento
        sobre avaliação de fontes](https://dashboard.wikiedu.org/training/students/evaluating-articles/what-is-a-good-source).'
      source_appropriate_question: Essa fonte é adequada para a Wikipédia, para este
        artigo específico e para a afirmação que ela sustenta?
      source_appropriate_options:
        appropriate: Sim, é uma fonte adequada para a afirmação
        depends_on_use: De certa forma, mas não é a melhor fonte para isso
        inappropriate: Não, esse não é o tipo certo de fonte para usar aqui
        unsure: Não tenho certeza
      source_appropriate_notes_label: Por que sim ou por que não? Se não, que tipo
        de fonte seria mais adequada?
      meets_rs_policy_question: Essa fonte é confiável?
      meets_rs_policy_options:
        generally_reliable: Sim, ela se encaixa claramente na definição de fonte confiável
          neste contexto
        context_dependent: De certa forma, mas tem algumas deficiências
        not_reliable: Não, isso claramente não se enquadra na definição de fonte confiável
          da Wikipédia
        unsure: Não tenho certeza
      meets_rs_policy_notes_label: O que torna essa fonte confiável, ou não?
      step_find_source: Encontre a fonte
      find_source_instructions: Agora que você selecionou sua afirmação, localize
        a fonte citada. Talvez seja necessário consultar seu professor ou bibliotecário
        para encontrar a fonte.
      source_access_question: Você conseguiu acessar o texto completo da fonte citada
        para fundamentar sua afirmação?
      source_access_options:
        accessed: Sim, tenho acesso ao código-fonte.
        nonexistent: Não, a fonte não existe.
        inaccessible: Não, a fonte existe, mas não consegui acessá-la.
      choose_another_claim_prompt: Como você não consegue acessar a fonte citada,
        escolha uma afirmação diferente para concluir este exercício.
      source_access_notes_label: 'Caso você não tenha conseguido encontrar a fonte,
        conte-nos mais sobre sua experiência:'
      step_verify: Verifique a alegação
      verify_instructions: |-
        Depois de encontrar a fonte citada, avalie até que ponto ela corrobora a afirmação que você escolheu. Se você descobrir exatamente de onde veio a informação, anote em que parte do documento a encontrou.

        Dicas para verificação:

        - Leia o resumo e a conclusão da fonte. Ela aborda o tema da afirmação?
        - Use a função “localizar” do seu aplicativo. Pesquise na fonte as palavras-chave da afirmação e, em seguida, leia o texto ao redor delas. Se você não conseguir encontrar as palavras-chave ou seus sinônimos no texto, é provável que a afirmação seja unverificável.
        - Textos criados por fontes de IA generativa costumam apresentar afirmações amplas e gerais sobre um tema, com uma citação que remete a uma fonte que oferece apenas um pequeno exemplo dessa afirmação. A afirmação está extrapolando uma afirmação geral a partir de um caso específico? Se for esse o caso, ela é unverificável.
      verdict_question: A fonte corrobora a afirmação?
      verdict_options:
        full_support: Sim — isso corrobora explicitamente a afirmação na íntegra.
        partial_support: Parcialmente — alguns elementos da afirmação provêm dessa
          fonte, mas uma parte significativa não.
        unsupported: Não — a fonte não aborda o que a alegação afirma.
        contradicted: Pelo contrário — a fonte, na verdade, contradiz essa afirmação.
        undetermined: Não consegui determinar se a afirmação constava na fonte citada.
        mostly_supports: Em grande parte, sim — o cerne da afirmação vem desta fonte.
        mostly_unsupported: Na maioria dos casos, não — a fonte é compatível com a
          afirmação, mas não a corrobora diretamente.
      verdict_option_descriptions:
        full_support: Consigo encontrar todos os fatos relativos à alegação na fonte
          citada.
        partial_support: Consigo encontrar alguns dos fatos mencionados na alegação,
          mas há informações na alegação que não consigo encontrar na fonte citada.
        unsupported: Não consigo encontrar nenhum dos fatos mencionados na alegação
          na fonte citada.
        contradicted: Encontrei fatos na fonte citada que afirmam o contrário do que
          é mencionado na alegação.
      claim_location_label: Se você conseguiu encontrar a afirmação, em que parte
        da fonte ela estava localizada? (por exemplo, número da página, capítulo,
        etc…)
