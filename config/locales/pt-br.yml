      start_date: Início da atividade de monitorização
      scoping_methods:
        scoping_methods: Métodos de escopo
        configure: Configurar métodos de escopo
        about: |-
          Para um programa com escopo definido por artigos, o painel de controle rastreará apenas as edições nos artigos que você configurou. Depois que sua página for criada, você poderá adicionar artigos individualmente para rastreamento, atribuindo-os a editores específicos ou adicionando-os como Artigos Disponíveis. Para conjuntos maiores de artigos, você pode usar qualquer uma dessas ferramentas para definir os artigos que deseja rastrear.
          Selecione agora os métodos de definição de escopo que deseja configurar. Você também pode adicionar métodos de definição de escopo posteriormente na guia Artigos.
        categories: Categorias
        categories_short_desc: O recurso de categoria na wiki é usado para coletar
          artigos relacionados. Você pode usar o nome da categoria para dizer ao Dashboard
          para acompanhar todos os artigos naquela categoria.
        categories_desc: |-
          Acompanhar uma categoria significa que o Dashboard contará as edições para qualquer artigo naquela categoria. Por definição (profundidade 0), somente os artigos que estão inseridos diretamente naquela categoria serão acompanhados.
          Você pode aumentar o valor da profundidade (até no máximo 3) se você quiser incluir artigos que estão em subcategorias daquela categoria. Certifique-se de procurar a categoria primeiro para ter certeza que as subcategorias correspondem ao que você pretende acompanhar.
        templates: Predefinições
        templates_short_desc: É possível rastrear artigos com base em uma predefinição
          que eles contenham, o que funciona independentemente de a predefinição ser
          usada no próprio artigo ou na página de discussão correspondente, como é
          o caso das predefinições de WikiProject.
        petscan: PetScan
        petscan_short_desc: PetScan é uma ferramenta que habilita você a consultar
          páginas wiki com base em uma ampla gama de critérios - incluindo categorias,
          modelos, wikilinks, e muitos outros. Você pode usar a consulta do PetScan
          ID para configurar um conjunto de artigos para acompanhar no Dashboard.
        pagepile: PagePile
        pagepile_short_desc: PagePile é uma ferramenta que permite criar uma lista
          de páginas que não muda ao longo do tempo e é identificada por um único
          ID.
        templates_desc: Os modelos são utilizados para uma ampla variedade de finalidades
          nas páginas da wiki, mas alguns são específicos para um determinado tópico.
          Modelos de navegação, modelos de projetos da wiki e modelos de infobox específicos
          para cada tópico são particularmente úteis ao se utilizar um modelo para
          configurar um programa com escopo de artigo.
        pagepile_desc: |-
          O PagePile é uma ferramenta da Wikimedia Cloud. Ele permite que os usuários reúnam e organizem um conjunto de páginas wiki em um único pacote chamado “pile”. Esses piles podem então ser facilmente compartilhados com outras pessoas, possibilitando o trabalho colaborativo e o compartilhamento de informações.
          Ao contrário do PetScan, os artigos em um pile não sofrem alterações ao longo do tempo, mesmo quando as categorias, os modelos ou outros dados usados para criar esse conjunto de artigos forem alterados.
        petscan_desc: |-
          O PetScan é uma ferramenta poderosa, porém complexa, para consultar um conjunto de páginas wiki com base em uma ampla variedade de critérios e fontes de dados. Você pode usar o PetScan diretamente para criar a consulta para um conjunto de artigos que deseja acompanhar, o que lhe dá acesso a todas as opções para direcionar sua consulta com muita precisão. Como alternativa, você pode criar uma consulta no PetScan a partir de algumas das opções mais comuns diretamente no Painel de Controle.
          O PetScan salva os parâmetros da consulta e fornece um ID para ela. Os resultados dessa consulta podem mudar com o tempo, por exemplo, quando novos artigos são adicionados à categoria incluída na consulta. O Painel atualiza periodicamente os resultados da consulta para um determinado ID e atualiza suas estatísticas com base no conjunto mais recente de artigos gerado pelo PetScan.
        petscan_create_psid: Crie um ID do PetScan usando a ferramenta oficial do
          PetScan
        pagepile_create_id: Crie um PagePile usando a ferramenta oficial do PagePile
        categories_include_OR: Artigos que contenham QUALQUER uma dessas categorias
          serão rastreados
        templates_include_OR: Artigos que contenham QUALQUER um desses modelos serão
          rastreados
