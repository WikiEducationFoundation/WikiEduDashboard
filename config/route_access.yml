# Who may call each routed controller action.
#
# spec/routing/route_access_spec.rb fails when a route has no entry here or an
# entry has no route, so every new route needs an explicit, reviewed access
# level. It also requests every route whose level isn't public, token, none or
# development while logged out, and fails if one answers with a success.
#
# A level is the weakest caller that can succeed, on either dashboard; a
# comment says when Wiki Ed is stricter. It describes who may call the action,
# not what each caller may see: public pages still leave out private courses.
#
#   public       anyone, including logged-out visitors
#   token        a credential other than the session: a signature, a shared
#                secret, an emailed code, an LTI launch token, a signed id
#   signed_in    any signed-in user
#   self         a signed-in user acting on their own records
#   participant  a user with a role in the course (and admins)
#   editor       a user who can edit the course: its instructors and Wiki Ed
#                staff, organizers of its campaigns, admins
#   organizer    a campaign organizer or an admin
#   admin        an admin
#   super_admin  a super admin
#   development  only in the development environment
#   none         routed, but no action answers it (404)

