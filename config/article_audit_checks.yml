  enabled: true

infobox.speciesbox:
  class: ArticleAuditing::Checks::Speciesbox
  enabled: true

flags.target_status:
  class: ArticleAuditing::Checks::TargetStatus
  enabled: true

# Pangram AI detection; skipped when pangram_api_key isn't set.
external.ai_detection:
  class: ArticleAuditing::Checks::AiDetection
  enabled: true

sourcing.unsourced_claims:
  class: ArticleAuditing::Checks::UnsourcedClaims
  enabled: true
  provider: anthropic
  model: claude-opus-5-5
  effort: medium

tone:
