# Article Audit check registry. See lib/article_auditing/registry.rb.
#
# Each key is a check's KEY. Checks run in the order listed here:
# deterministic checks first, then LLM checks (the first LLM check runs alone
# so it writes the prompt cache; the rest run in parallel).
#
# For LLM checks, `provider`, `model` and `effort` choose the engine. Moving a
# check to another engine is a change here (plus a new check class if the
# implementation changes, eg from a prompt to plain code).

sourcing.reference_list:
  class: ArticleAuditing::Checks::ReferenceList
  enabled: true

mos.reference_placement:
  class: ArticleAuditing::Checks::ReferencePlacement
  enabled: true

structure.lead_section:
  class: ArticleAuditing::Checks::LeadSection
  enabled: true

mos.appendix_sections:
  class: ArticleAuditing::Checks::AppendixSections
  enabled: true

links.external_links_in_body:
  class: ArticleAuditing::Checks::ExternalLinksInBody
  enabled: true

structure.drafting_leftovers:
  class: ArticleAuditing::Checks::DraftingLeftovers
  enabled: true

flags.page_status:
  class: ArticleAuditing::Checks::PageFlags
  enabled: true

language.not_english:
  class: ArticleAuditing::Checks::Language
  enabled: true

mos.emphasis:
  class: ArticleAuditing::Checks::Emphasis
  enabled: true

mos.date_format:
  class: ArticleAuditing::Checks::DateFormat
  enabled: true

mos.sentence_spacing:
  class: ArticleAuditing::Checks::SentenceSpacing
  enabled: true

sourcing.page_numbers:
  class: ArticleAuditing::Checks::PageNumbers
  enabled: true

links.duplicate_links:
  class: ArticleAuditing::Checks::DuplicateLinks
  enabled: true

links.inappropriate_external_links:
  class: ArticleAuditing::Checks::InappropriateExternalLinks
  enabled: true

# Wiki-context checks: these look up the article's surroundings on the wiki
# (see lib/article_auditing/wiki_context.rb).
new_article.wikidata:
  class: ArticleAuditing::Checks::WikidataItem
  enabled: true

links.navboxes:
  class: ArticleAuditing::Checks::Navboxes
  enabled: true

links.incoming_links:
  class: ArticleAuditing::Checks::IncomingLinks
  enabled: true

sourcing.author_links:
  class: ArticleAuditing::Checks::AuthorLinks
  enabled: true

mos.engvar:
