yarnPath: .yarn/releases/yarn-3.8.7.cjs
nodeLinker: node-modules
checksumBehavior: update

# Advisories that `yarn npm audit` (the security-audit job in CI) reports,
# but that have been reviewed and don't affect the dashboard. Entries are
# npm's numeric advisory IDs, as `yarn npm audit --json` shows them; each
# one notes its GitHub advisory and why it doesn't apply. Remove an entry
# once the package has a release that fixes the issue.
#
# `yarn set version` and `yarn config set` rewrite this file and drop its
# comments, so restore them after running either.
npmAuditIgnoreAdvisories:
  # GHSA-vfj7-8cjw-p6xm, braces <= 3.0.3 (the latest release): deeply nested
  # brace patterns can exhaust the stack and crash the Node process. braces
  # only expands glob patterns from our own build and test configuration
  # (via micromatch and chokidar), never patterns from users, and these
  # tools don't run on the servers, since assets are compiled before deploy.
  - "1240992"
  # GHSA-ch52-4w7c-c8xp, http-cache-semantics <= 4.2.0: a cache shared
  # between users can serve one user's response to another. It's only here
  # through fsevents > node-gyp > make-fetch-happen; fsevents is macOS-only,
  # so it isn't installed in CI, and node-gyp doesn't use it as a cache
  # shared between users. 4.3.0 is outside the advisory's range but doesn't
  # change the max-stale handling the advisory describes, so upgrading
  # wouldn't fix it.
  - "1240991"
