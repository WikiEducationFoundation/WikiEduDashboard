        class=\"diff-marker\" data-marker=\"+\"></td>\n  <td class=\"diff-addedline
        diff-side-added\"><div>In simulation, our real city street can be turned into
        virtual digital twins. Self-driving cars can be tested there without driving
        on railroads. This approach also costs lower than testing on real streets.
        For example, StreetGaussians uses videos to reconstruct the street and moving
        vehicles as the simulation environment for training self-driving vehicles.&lt;ref&gt;{{Citation
        |last=Yan |first=Yunzhi |title=Street Gaussians: Modeling Dynamic Urban Scenes
        with Gaussian Splatting |date=2025 |work=Computer Vision \u2013 ECCV 2024
        |volume=15131 |pages=156\u2013173 |editor-last=Leonardis |editor-first=Ale\u0161
        |url=https://link.springer.com/10.1007/978-3-031-73464-9_10 |access-date=2026-10-31
        |place=Cham |publisher=Springer Nature Switzerland |language=en |doi=10.1007/978-3-031-73464-9_10
        |isbn=978-3-031-73463-2 |last2=Lin |first2=Haotong |last3=Zhou |first3=Chenxu
        |last4=Wang |first4=Weijie |last5=Sun |first5=Haiyang |last6=Zhan |first6=Kun
        |last7=Lang |first7=Xianpeng |last8=Zhou |first8=Xiaowei |last9=Peng |first9=Sida
        |editor2-last=Ricci |editor2-first=Elisa |editor3-last=Roth |editor3-first=Stefan
        |editor4-last=Russakovsky |editor4-first=Olga}}&lt;/ref&gt;</div></td>\n</tr>\n<tr>\n  <td
        colspan=\"2\" class=\"diff-empty diff-side-deleted\"></td>\n  <td class=\"diff-marker\"
        data-marker=\"+\"></td>\n  <td class=\"diff-addedline diff-side-added\"><br
        /></td>\n</tr>\n<tr>\n  <td colspan=\"2\" class=\"diff-empty diff-side-deleted\"></td>\n  <td
        class=\"diff-marker\" data-marker=\"+\"></td>\n  <td class=\"diff-addedline
        diff-side-added\"><div>In content production, 4D reconstruction can create
        new viewers for free film and extended reality. It can capture dynamic content
        used for games and extended reality directly from our real sense to save a
        lot of manual modeling work.&lt;ref name=\"YunusLenssenNiemeyerLiao2024-1\"
        /&gt; And it''s used to make digital humans, such as turning a real person''s
        movement into the digital world.&lt;ref name=\"JiangShenHongGuo2024-1\" /&gt;&lt;ref&gt;{{Cite
        journal |last=Han |first=Dong |last2=Su |first2=Cheng-Ye |last3=Zeng |first3=Fan-Yi
        |last4=Zhang |first4=Fang-Lue |last5=Wang |first5=Miao |date=2026-11 |title=Dynamic
        scene representation in the era of neural rendering: from NeRFs to 3DGSs |url=https://link.springer.com/10.1007/s11704-025-50389-x
        |journal=Frontiers of Computer Science |language=en |volume=20 |issue=11 |pages=2011708
        |doi=10.1007/s11704-025-50389-x |issn=2095-2228}}&lt;/ref&gt;</div></td>\n</tr>\n<tr>\n  <td
