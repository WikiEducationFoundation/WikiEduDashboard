      encoding: ASCII-8BIT
      string: '{"warnings":{"main":{"*":"Unrecognized parameter: token."}},"parse":{"title":"API","pageid":27697009,"text":{"*":"<div
        class=\"mw-content-ltr mw-parser-output\" lang=\"en\" dir=\"ltr\"><div class=\"mw-heading
        mw-heading2\"><h2 id=\"Application\">Application</h2></div>\n<p>In immersive
        media, 4D reconstruction is used for free viewpoint video. That means a performance
        can be recorded by many cameras at the same time. It will generate a 3D video
        that can be compressed and played online. So viewers can choose their own
        viewing angle for free.<sup id=\"cite&#95;ref-1\" class=\"reference\"><a href=\"#cite_note-1\"><span
        class=\"cite-bracket\">&#91;</span>1<span class=\"cite-bracket\">&#93;</span></a></sup>
        It can also be used for telepresence. That means a person is reconstructed
        as a 3D model in real time. And send it to a far-away place. And someone wearing
        a mixed reality headset can see this person like they are standing in front
        of them and can interact with them.<sup id=\"cite&#95;ref-2\" class=\"reference\"><a
        href=\"#cite_note-2\"><span class=\"cite-bracket\">&#91;</span>2<span class=\"cite-bracket\">&#93;</span></a></sup>
        In virtual reality, a musician''s performance can be recorded and compressed
        into a very small view, and then viewers wearing a VR headset can watch it
        from any angle.<sup id=\"cite&#95;ref-JiangShenHongGuo2024-1&#95;3-0\" class=\"reference\"><a
        href=\"#cite_note-JiangShenHongGuo2024-1-3\"><span class=\"cite-bracket\">&#91;</span>3<span
        class=\"cite-bracket\">&#93;</span></a></sup> Researchers were developing
        3D live streaming for sports. The players in the basketball game are reconstructed,
        so viewers can move around in the 3D scene when they are watching the live
        streaming game.<sup id=\"cite&#95;ref-4\" class=\"reference\"><a href=\"#cite_note-4\"><span
        class=\"cite-bracket\">&#91;</span>4<span class=\"cite-bracket\">&#93;</span></a></sup>\n</p><p>In
        simulation, our real city street can be turned into virtual digital twins.
        Self-driving cars can be tested there without driving on railroads. This approach
        also costs lower than testing on real streets. For example, StreetGaussians
        uses videos to reconstruct the street and moving vehicles as the simulation
        environment for training self-driving vehicles.<sup id=\"cite&#95;ref-5\"
        class=\"reference\"><a href=\"#cite_note-5\"><span class=\"cite-bracket\">&#91;</span>5<span
        class=\"cite-bracket\">&#93;</span></a></sup>\n</p><p>In content production,
        4D reconstruction can create new viewers for free film and extended reality.
        It can capture dynamic content used for games and extended reality directly
        from our real sense to save a lot of manual modeling work.<sup id=\"cite&#95;ref-YunusLenssenNiemeyerLiao2024-1&#95;6-0\"
        class=\"reference\"><a href=\"#cite_note-YunusLenssenNiemeyerLiao2024-1-6\"><span
        class=\"cite-bracket\">&#91;</span>6<span class=\"cite-bracket\">&#93;</span></a></sup>
        And it''s used to make digital humans, such as turning a real person''s movement
        into the digital world.<sup id=\"cite&#95;ref-JiangShenHongGuo2024-1&#95;3-1\"
        class=\"reference\"><a href=\"#cite_note-JiangShenHongGuo2024-1-3\"><span
        class=\"cite-bracket\">&#91;</span>3<span class=\"cite-bracket\">&#93;</span></a></sup><sup
        id=\"cite&#95;ref-7\" class=\"reference\"><a href=\"#cite_note-7\"><span class=\"cite-bracket\">&#91;</span>7<span
        class=\"cite-bracket\">&#93;</span></a></sup>\n</p>\n<div class=\"mw-references-wrap\"><ol
        class=\"references\">\n<li id=\"cite&#95;note-1\"><span class=\"mw-cite-backlink\"><b><a
