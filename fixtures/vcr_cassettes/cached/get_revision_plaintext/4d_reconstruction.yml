        class=\"diff-empty diff-side-deleted\"></td>\n  <td class=\"diff-marker\"
        data-marker=\"+\"></td>\n  <td class=\"diff-addedline diff-side-added\"><div>In
        immersive media, 4D reconstruction is used for free viewpoint video. That
        means a performance can be recorded by many cameras at the same time. It will
        generate a 3D video that can be compressed and played online. So viewers can
        choose their own viewing angle for free.&lt;ref&gt;{{Cite journal |last=Collet
        |first=Alvaro |last2=Chuang |first2=Ming |last3=Sweeney |first3=Pat |last4=Gillett
        |first4=Don |last5=Evseev |first5=Dennis |last6=Calabrese |first6=David |last7=Hoppe
        |first7=Hugues |last8=Kirk |first8=Adam |last9=Sullivan |first9=Steve |date=2015-07-27
        |title=High-quality streamable free-viewpoint video |url=https://dl.acm.org/doi/10.1145/2766945
        |journal=ACM Transactions on Graphics (TOG) |location=New York, NY, USA |publisher=Association
        for Computing Machinery |volume=34 |issue=4 |pages=69:1\u201369:13 |doi=10.1145/2766945
        |issn=0730-0301}}&lt;/ref&gt; It can also be used for telepresence. That means
        a person is reconstructed as a 3D model in real time. And send it to a far-away
        place. And someone wearing a mixed reality headset can see this person like
        they are standing in front of them and can interact with them.&lt;ref&gt;{{Cite
        journal |last=Orts-Escolano |first=Sergio |last2=Rhemann |first2=Christoph
        |last3=Fanello |first3=Sean |last4=Chang |first4=Wayne |last5=Kowdle |first5=Adarsh
        |last6=Degtyarev |first6=Yury |last7=Kim |first7=David |last8=Davidson |first8=Philip
        L. |last9=Khamis |first9=Sameh |last10=Dou |first10=Mingsong |last11=Tankovich
        |first11=Vladimir |last12=Loop |first12=Charles |last13=Cai |first13=Qin |last14=Chou
        |first14=Philip A. |last15=Mennicken |first15=Sarah |date=2016-10-16 |title=Holoportation:
        Virtual 3D Teleportation in Real-time |url=https://dl.acm.org/doi/10.1145/2984511.2984517
        |journal=Proceedings of the 29th Annual Symposium on User Interface Software
        and Technology |series=UIST ''16 |location=New York, NY, USA |publisher=Association
        for Computing Machinery |pages=741\u2013754 |doi=10.1145/2984511.2984517 |isbn=978-1-4503-4189-9}}&lt;/ref&gt;
        In virtual reality, a musician''s performance can be recorded and compressed
        into a very small view, and then viewers wearing a VR headset can watch it
        from any angle.&lt;ref name=\"JiangShenHongGuo2024-1\"&gt;{{Cite journal |last=Jiang
        |first=Yuheng |last2=Shen |first2=Zhehao |last3=Hong |first3=Yu |last4=Guo
        |first4=Chengcheng |last5=Wu |first5=Yize |last6=Zhang |first6=Yingliang |last7=Yu
        |first7=Jingyi |last8=Xu |first8=Lan |date=2024-11-19 |title=Robust Dual Gaussian
        Splatting for Immersive Human-centric Volumetric Videos |url=https://dl.acm.org/doi/10.1145/3687926
        |journal=ACM Transactions on Graphics (TOG) |location=New York, NY, USA |publisher=Association
        for Computing Machinery |volume=43 |issue=6 |pages=265:1\u2013265:15 |doi=10.1145/3687926
        |issn=0730-0301}}&lt;/ref&gt; Researchers were developing 3D live streaming
        for sports. The players in the basketball game are reconstructed, so viewers
        can move around in the 3D scene when they are watching the live streaming
        game.&lt;ref&gt;{{Cite web |title=Echoes of the Coliseum: Towards 3D Live
        streaming of Sports Events - Robotics Institute Carnegie Mellon University
        |url=https://publications.ri.cmu.edu/echoes-of-the-coliseum-towards-3d-live-streaming-of-sports-events
        |access-date=2026-10-31 |website=publications.ri.cmu.edu |language=en}}&lt;/ref&gt;</div></td>\n</tr>\n<tr>\n  <td
        colspan=\"2\" class=\"diff-empty diff-side-deleted\"></td>\n  <td class=\"diff-marker\"
        data-marker=\"+\"></td>\n  <td class=\"diff-addedline diff-side-added\"><br
