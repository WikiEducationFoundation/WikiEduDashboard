# Maps the course `subject` string carried on each harvested claim to a broad
# discipline bucket, so the curated set can be balanced across sciences,
# social sciences, and humanities.
#
# Keys are matched case-insensitively against the exact subject string, with
# surrounding whitespace stripped. Subjects not listed here — including the
# blank subject, which is the single largest group in the pool — come out as
# `unclassified` and need a human call.
#
# Edit freely.

