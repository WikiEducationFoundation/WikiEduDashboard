# Source-access classification for the Fact Verification claim pool.
#
# Used by build_article_inventory.rb to bucket each claim's source_url by how
# readable the cited source is likely to be for a student with no library
# proxy. This is a *heuristic prior*, not a verified access check — nothing
# here has been fetched. Treat the resulting counts as a way to rank articles
# for hand-checking, not as ground truth.
#
# Tiers:
#   open          - full text freely readable, no login
#   paywalled     - subscription or purchase needed for the full text
#   abstract_only - citation/abstract free, full text is not
#   doi_redirect  - indirection; real access unknown until the DOI resolves
#
# Matching: a claim's host is matched against `domains` by exact host or by
# any parent domain (so `agupubs.onlinelibrary.wiley.com` matches
# `onlinelibrary.wiley.com`). If nothing matches, `suffix_rules` are tried in
# order. Anything still unmatched is counted as `unknown`.
#
# Edit freely — this file is meant to be tuned as spot-checks come back.

tiers:
  doi_redirect:
    domains:
      - doi.org
      - dx.doi.org
      - hdl.handle.net

  abstract_only:
    domains:
