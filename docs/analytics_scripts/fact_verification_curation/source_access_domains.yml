# Tried in order when no domain match is found. `suffix` matches the end of
# the host; `contains` matches anywhere in the host.
suffix_rules:
  - suffix: .gov
    tier: open
  - suffix: .mil
    tier: open
  - contains: .gov.
    tier: open
  - suffix: .int
    tier: open
  - contains: nih.gov
    tier: open
  # University and library hosts are mostly open pages, but proxied catalog
  # and database links are not. Catalog/proxy hosts are caught first.
  - contains: proxy
    tier: paywalled
  - contains: search.library
    tier: paywalled
  - suffix: .edu
    tier: open
  - contains: .edu.
    tier: open
  - contains: .ac.
    tier: open

# Hosts that are freely readable but are not the kind of source this exercise
# should lean on — self-published author/organization sites, user-generated
# reference sites, video, and homework-help mills. Counted separately as a
# sourcing-quality signal; they still get an access tier from the rules above.
weak_source_domains:
  - imdb.com
  - youtube.com
  - www.scribd.com
  - www.vedantu.com
  - kristinhannah.com
